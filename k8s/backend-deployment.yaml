apiVersion: apps/v1
kind: Deployment
metadata:
  name: airbnb-backend-deployment
  labels:
    app: airbnb
    component: backend
spec:
  replicas: 2 # Scale up replicas for high availability (HA)
  selector:
    matchLabels:
      app: airbnb
      component: backend
  template:
    metadata:
      labels:
        app: airbnb
        component: backend
    spec:
      containers:
        - name: backend
          image: airbnb-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
              name: api
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: airbnb-secrets
                  key: database-url
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: airbnb-config
                  key: backend-port
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: airbnb-config
                  key: node-env
          resources:
            limits:
              cpu: "500m"
              memory: "256Mi"
            requests:
              cpu: "100m"
              memory: "128Mi"
          # Self-healing probes
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
